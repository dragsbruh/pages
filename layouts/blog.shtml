<extend template="base.shtml">

<head id="head">
	<meta property="og:image" content="$site.asset('avatar.jpg').link()">
	<meta property="og:image:alt" content="TODO: blog images">

	<meta name="twitter:card" content="summary">
	<meta name="twitter:image" content="$site.asset('avatar.jpg').link()">
	<meta name="twitter:image:alt" content="TODO: blog images">
</head>

<main id="main">
	<h1 :text="$page.title"></h1>

	<div :if="$site.page('blog').isCurrent().not()">
		<ctx :if="$page.nextPage?()">
			<div>
				<span>next:</span>
				<a href="$if.link()" title="$if.description">
					<ctx :text="$if.title"></ctx>
				</a>
			</div>
		</ctx>

		<ctx :if="$page.prevPage?()">
			<div>
				<span>previous:</span>
				<a href="$if.link()" title="$if.description">
					<ctx :text="$if.title"></ctx>
				</a>
			</div>
		</ctx>
	</div>

	<div :html="$page.content()"></div>

	<ctx :if="$page.subpages().len.gt(0)">
		<h3>subpages</h3>
		<div :loop="$page.subpages()" class="column-list">
			<a href="$loop.it.link()" title="$loop.it.description">
				<ctx :text="$loop.it.date.format('2006-01-02')"></ctx>
				<ctx :text="$loop.it.title"></ctx>
			</a>
		</div>
	</ctx>
</main>
